[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-easyapi"
version = "0.1.0"
description = "EasyAPI creative workflows, media and realtime audio for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EasyAPI"}]
dependencies = ["aiohttp>=3.10,<4", "av>=18.1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
deploy = ["paramiko>=3,<5"]

[project.urls]
Homepage = "https://www.easyapi.com"
Documentation = "https://www.easyapi.com/docs"

[tool.setuptools.packages.find]
include = ["easyapi_comfy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.comfy]
DisplayName = "ComfyUI-EasyAPI"
Icon = ""
